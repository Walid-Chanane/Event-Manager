spring:
  application:
    name: event_service
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 30
        default-sort: id,ASC

  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: postgres
    password: postgres
  
  jpa:
    hibernate: 
      ddl-auto: create-drop
    show-sql: true
    properties:
        hibernate:
          format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

application:
  file:
    upload:
      path: ./uploads
      
  security:
    jwt:
      # secret-key: ${JWT_SECRET}
      secret-key: 0A0486EBF19DB7AA36FECD29D6F4D635674692E7E5BD757F8BE32346CC7FCE1E
      expiration: 86400000