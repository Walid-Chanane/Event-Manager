spring:
  application:
    name: event_service
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 30
        default-sort: id,ASC

  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: postgres
    password: postgres
  
  jpa:
    hibernate: 
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
          format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

application:
  file:
    upload:
      path: ./uploads