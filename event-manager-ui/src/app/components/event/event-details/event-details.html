<div class="d-flex justify-content-center">
  <h1 style="font-family: 'Lobster', sans-serif; font-size: 7rem;">Manage Events</h1>
</div>
<nav>
  <div class="container d-flex justify-content-center pb-2">

    <a href="addEvent" class="btn btn-link text-decoration-none" style="font-family: 'Lobster', sans-serif; font-size: 1.5rem">
    Manage Events
    </a>

    <a href="events/upcoming" class="btn btn-link text-decoration-none" style="font-family: 'Lobster', sans-serif; font-size: 1.5rem">
      Upcoming Events
    </a>

    <a href="addEvent" class="btn btn-link text-decoration-none" style="font-family: 'Lobster', sans-serif; font-size: 1.5rem">
      Add Event
    </a>

    <a href="notifications" class="btn btn-link text-decoration-none" style="font-family: 'Lobster', sans-serif; font-size: 1.5rem">
      Notifications
    </a>
    
    <a href="/login" (click)="logout()"  class="btn btn-link text-decoration-none" style="font-family: 'Lobster', sans-serif; font-size: 1.5rem">
      Logout
    </a>
    
  </div>
</nav>

<div class="d-flex justify-content-center pt-5">
<div *ngIf="eventItem" class="card border-3" style="width: 60rem;"
     [ngClass]="{'border-success': eventItem.status === 'ACTIVE', 'border-warning': eventItem.status === 'CANCELLED'}">

  <div class="card-body overflow-auto">

      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input id="title" name="title" class="form-control"
               type="text"
               [(ngModel)]="eventItem.title"
               [disabled]="!isEditing"
               required>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" class="form-control"
                  rows="3"
                  [(ngModel)]="eventItem.description"
                  [disabled]="!isEditing"></textarea>
      </div>

      <div class="row g-2">
        <div class="col-md-6 mb-3">
          <label for="time" class="form-label">Time</label>
          <input id="time" name="time" class="form-control"
                 type="datetime-local"
                 [(ngModel)]="eventItem.time"
                 [disabled]="!isEditing">
        </div>

        <div class="col-md-6 mb-3">
          <label for="location" class="form-label">Location</label>
          <input id="location" name="location" class="form-control"
                 type="text"
                 [(ngModel)]="eventItem.location"
                 [disabled]="!isEditing">
        </div>
      </div>

      <div class="mb-3">
        <small class="text-muted">Status: <strong>{{ eventItem.status }}</strong></small>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <div *ngIf="eventItem.files?.length; else noFiles">
            <ul class="list-unstyled d-flex flex-wrap gap-2">
              <li *ngFor="let file of eventItem.files" class="me-2">
                <div *ngIf="file.contentType.startsWith('image')">
                  <img [src]="file.filePath" [alt]="file.fileName" class="img-thumbnail" style="max-width:150px; max-height:150px;">
                </div>

                <div *ngIf="file.contentType.startsWith('video')">
                  <video [src]="file.filePath" controls style="max-width:300px; max-height:200px;"></video>
                </div>

                <div *ngIf="!file.contentType.startsWith('image') && !file.contentType.startsWith('video')">
                  <a [href]="file.filePath" target="_blank" rel="noopener">{{ file.fileName }}</a>
                </div>
              </li>
            </ul>
          </div>
          <ng-template #noFiles>
            <div class="text-muted justify-content-center">No files attached.</div>
          </ng-template>
        </div>
      </div>

      <div class="d-flex gap-2 mb-2">
        <button type="button" class="btn btn-danger" (click)="cancel()">Cancel Event</button>
        <div class="btn-group d-inline ms-auto">
          <button type="button" class="btn btn-primary" (click)="edit()">{{ isEditing ? 'Cancel Editing' : 'Edit' }}</button>
          <button *ngIf="isEditing" type="button" class="btn btn-success" (click)="save()">Save</button>
        </div>
      
      </div>
      <!-- <button type="button" class="btn btn-outline-primary w-100" (click)="getParticipants()">Participants</button> -->
  </div>
  <!-- Participants section -->
<div class="card border-0">
  <div class="card-header d-flex align-items-center">
      <button
      type="button"
      class="btn btn-outline-primary fw-semibold w-100 ms-auto w-100"
      (click)="getParticipants()"
      >
      Participants
      <span class="badge bg-secondary ms-2">
        {{ eventItem.participantIDs?.length || 0 }}
      </span>
    </button>

  </div>

  <div class="card-body p-0" *ngIf="showParticipants">

    <div *ngIf="participants.length === 0" class="p-3 text-muted text-center">
      No participants.
    </div>

    <!-- Table -->
    <div *ngIf="participants.length > 0" class="table-responsive">
      <table class="table table-hover table-sm mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th class="text-end">Date of birth</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of participants">
            <td class="fw-semibold">
              {{ p.firstName }} {{ p.lastName }}
            </td>
            <td class="text-truncate" style="max-width: 18rem;">
              {{ p.email }}
            </td>
            <td class="text-end">
              {{ p.dateOfBirth | date:'yyyy-MM-dd' }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

</div>

<div *ngIf="!eventItem" class="alert alert-info">No event loaded.</div>

</div>
