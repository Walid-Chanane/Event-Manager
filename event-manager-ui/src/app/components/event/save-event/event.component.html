
    <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" class="form-control" id="title" [(ngModel)]="event.title">
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea class="form-control" id="description" [(ngModel)]="event.description"></textarea>
    </div>
    <div class="form-group">
        <label for="time">Time:</label>
        <input type="datetime-local" class="form-control" id="time" [(ngModel)]="event.time">
    </div>
    <div class="form-group">
        <label for="location">Location:</label>
        <input type="text" class="form-control" id="location" [(ngModel)]="event.location">
    </div>
    <div class="form-group">
    <input type="file" (change)="onFileSelected($event)" multiple/>
    <ul>
    <li *ngFor="let file of files; let i = index">
        {{ file.name }}
        <button (click)="deleteFile(i)">Delete</button>
    </li>
    </ul>

    <button (click)="resetFiles()">Reset All</button>
    <button (click)="saveEvent()" type="button" class="btn btn-primary">Submit</button>
    </div>
<style>
    .form-group {
        margin-bottom: 10px;
    }
</style>
