<div class="card border-3" style="width: 60rem;"
[class.border-success]="eventItem.status == 'ACTIVE'"
[class.border-warning]="eventItem.status != 'ACTIVE'"
>

  <div class="card-body overflow-scroll">
    <h3 class="card-title text-nowrap fw-bold mb-1">
      <i class=""></i> {{eventItem.title}}
    </h3>
    <h5 class="card-subtitle text-secondary mb-1">
      <i class=""></i> {{eventItem.description}}
    </h5>
    <h6 class="card-subtitle fs-6 mb-1">
      <i class=""></i> {{eventItem.time}}
    </h6>
    <h6 class="card-subtitle fs-6">
      <i class=""></i> {{eventItem.location}}
    </h6>

    <div class="card-footer d-flex gap-2 justify-content-between align-items-center">
      <div class="d-flex gap-2">
        <div class="event-files">
          <ul class="list-unstyled" *ngIf="eventItem.files.length > 0">
            <li *ngFor="let file of eventItem.files">

              <div *ngIf="file.contentType.startsWith('image')">
                <img [src]="file.filePath" [alt]="file.fileName" class="event-image" />
              </div>

              <div *ngIf="file.contentType.startsWith('video')">
                <video [src]="file.filePath" controls class="event-video"></video>
              </div>

              <div *ngIf="!file.contentType.startsWith('image') && !file.contentType.startsWith('video')">
                <embed [src]="file.filePath" type="application/pdf" width="600" height="500">
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="">
      <div class="d-inline" *ngIf="isAdmin()"><button (click)="goToDetails()" type="button" class="btn btn-primary">Details</button> | </div>
      <button (click)="register()" type="button" class="btn btn-success">Register</button> | 
      <button (click)="withdraw()" type="button" class="btn btn-danger">Withdraw</button>
    </div>
  </div>
</div>
<hr>
